<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" role="img" aria-labelledby="title desc"><title id="title">How to interpret Playwright test results</title><desc id="desc">Three results: passed means assertion succeeded; failed means investigate expected and received; skipped means not run. Below is a checklist: confirm assertion, inspect actions, reopen if saved, report evidence.</desc>
<rect width="1040" height="320" rx="18" fill="#f3f5fa"/><rect x="20" y="19" width="1000" height="282" rx="13" fill="#fff" stroke="#dce4ee"/>
<text x="40" y="58" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#2b285e">A result is only useful when you check the assertion.</text>
<g font-family="Arial,sans-serif">
<rect x="40" y="86" width="305" height="118" rx="10" fill="#ecf8f3" stroke="#b7e3ce"/><circle cx="68" cy="112" r="13" fill="#198a6b"/><path d="m62 111 5 6 9-11" fill="none" stroke="#fff" stroke-width="2.5"/><text x="91" y="119" font-size="17" font-weight="700" fill="#156a51">PASSED</text><text x="56" y="153" font-size="13" fill="#36556a">The coded checks passed.</text><text x="56" y="177" font-size="12" fill="#36556a">Check if they cover the requirement.</text>
<rect x="367" y="86" width="305" height="118" rx="10" fill="#fff0f1" stroke="#f1bfc8"/><circle cx="395" cy="112" r="13" fill="#b3394e"/><path d="M390 107 400 117 M400 107 390 117" fill="none" stroke="#fff" stroke-width="2.5"/><text x="417" y="119" font-size="17" font-weight="700" fill="#a13247">FAILED</text><text x="383" y="153" font-size="13" fill="#36556a">Read Expected and Received.</text><text x="383" y="177" font-size="12" fill="#36556a">Check if the UI or selector is wrong.</text>
<rect x="694" y="86" width="305" height="118" rx="10" fill="#f0f2f6" stroke="#d5dbe6"/><circle cx="722" cy="112" r="13" fill="#778399"/><path d="M717 112h10" stroke="#fff" stroke-width="3"/><text x="744" y="119" font-size="17" font-weight="700" fill="#586579">SKIPPED</text><text x="710" y="153" font-size="13" fill="#36556a">The test did not execute.</text><text x="710" y="177" font-size="12" fill="#36556a">Never report it as a pass.</text>
<path d="M40 231h960" stroke="#dce4ee"/>
<g font-size="14" fill="#2e2b61" font-weight="700"><text x="41" y="267">01 · Read expect(...)</text><text x="288" y="267">02 · Inspect Actions</text><text x="542" y="267">03 · Reopen / reload</text><text x="804" y="267">04 · Record evidence</text></g></g></svg>